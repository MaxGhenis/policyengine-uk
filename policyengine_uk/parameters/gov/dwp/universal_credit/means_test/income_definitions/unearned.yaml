description: >
  Unearned income sources for Universal Credit. Regulation 66(1) defines
  unearned income as income "falling within the following descriptions" and
  lists them in sub-paragraphs (a) to (m); income outside that list is not
  taken into account (DWP Advice for Decision Making H5002 and H5112). Actual
  interest, dividends and rent fall in none of them: sub-paragraph (m) reaches
  only income taxable under Part 5 of the Income Tax (Trading and Other Income)
  Act 2005, whereas interest and dividends are charged under Part 4 and
  property income under Part 3. Capital instead counts through its assumed
  yield under regulation 72(1) (`uc_tariff_income`, sub-paragraph (k)), and
  regulation 72(3) treats actual income derived from capital, "for example
  rental, interest or dividends", as part of the person's capital. So
  `savings_interest_income`, `dividend_income` and `property_income` are not on
  this list at any capital level. Letting that amounts to a trade, such as a
  bed and breakfast, gives self-employed earnings under regulation 57, which
  the model reads from `self_employment_income`.
