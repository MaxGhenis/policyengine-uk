description: The Department for Education converts childcare hours into expenses for childcare entitlement at these rates, the national average of the hourly rates it funds local authorities at for each age group.
metadata:
  type: single_amount
  threshold_unit: year
  amount_unit: currency-GBP
  label: Childcare entitlement hourly rates by age
  # After the last published year the rates rise with CPI.
  uprating: gov.benefit_uprating_cpi
  reference:
    - title: House of Commons Library | Early years funding in England
      href: https://commonslibrary.parliament.uk/research-briefings/cbp-8052/
    - title: DfE | 2024 to 2025 early years national funding formulae, technical note, Table 4
      href: https://www.gov.uk/government/publications/early-years-funding-2024-to-2025/2024-to-2025-early-years-national-funding-formulae-technical-note#to-2025-average-hourly-funding-rates
    - title: DfE | 2025 to 2026 early years national funding formulae, technical note, Table 6
      href: https://www.gov.uk/government/publications/early-years-funding-2025-to-2026/2025-to-2026-early-years-national-funding-formulae-technical-note#table-6-2025-to-2026-national-average-of-local-authority-hourly-funding-rates
    - title: DfE | 2026 to 2027 early years national funding formulae, technical note, Table 6
      href: https://www.gov.uk/government/publications/early-years-funding-2026-to-2027/2026-to-2027-early-years-national-funding-formulae-technical-note#table-6-2026-to-2027-national-average-of-local-authority-hourly-funding-rates

# Under 2s (working parent entitlement), 2-year-olds (combined average of the
# early learning for 2-year-olds and working parent entitlements), and 3 and
# 4-year-olds (combined average of the universal and additional hours). The
# 2026-27 rate for 3 and 4-year-olds includes DfE's 2.94% increase to offset
# the fewer part-time equivalents counted under termly funding (technical
# note, section 3.3).
brackets:
  - threshold:
      2015-01-01: 0
    amount:
      2024-04-01: 11.22
      2025-04-01: 11.54
      2026-04-01: 12.04
  - threshold:
      2015-01-01: 2
    amount:
      2024-04-01: 8.28
      2025-04-01: 8.53
      2026-04-01: 8.90
  - threshold:
      2015-01-01: 3
    amount:
      2024-04-01: 5.88
      2025-04-01: 6.12
      2026-04-01: 6.61
