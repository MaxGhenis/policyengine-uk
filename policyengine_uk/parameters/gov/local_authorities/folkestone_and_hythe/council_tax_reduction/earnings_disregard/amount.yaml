description: Folkestone and Hythe Council Tax Reduction weekly earnings disregard. Section 19.1 of the adopted 2026/27 scheme disregards 25 pounds per week from an applicant's net earnings, applies irrespective of the claimant's household, and grants only one disregard per claim.
