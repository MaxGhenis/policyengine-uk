description: Folkestone and Hythe Council Tax Reduction working-age capital limit. Section 27.1 of the adopted 2026/27 scheme sets the prescribed amount at 16,000 pounds; no support is granted when the applicant's capital is greater than that level. Schedule 3 of the scheme has no wholesale capital disregard for applicants on Income Support, income-based Jobseeker's Allowance or income-related Employment and Support Allowance, so passported applicants whose capital exceeds 16,000 pounds are still excluded.
values:
