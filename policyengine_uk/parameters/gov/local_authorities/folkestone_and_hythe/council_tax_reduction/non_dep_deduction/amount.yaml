description: Folkestone and Hythe Council Tax Reduction working-age non-dependant deduction. Section 39.5 of the adopted 2026/27 scheme reduces any award by 10 pounds per week for each non-dependant who resides within the premises. Section 39.6 waives the deduction where the non-dependant is on Jobseeker's Allowance (income-based), income-related Employment Support Allowance, Income Support, Pension Credit (Guarantee Credit), or Universal Credit with no earnings.
values:
