description: Folkestone and Hythe weekly income-band Council Tax Reduction rate for households with two or more children or young persons. Schedule 1 paragraph 1 of the adopted 2026/27 scheme sets discount rates 100/75/50/25/0 per cent across the GBP 0.00-357.00, GBP 357.01-448.00, GBP 448.01-550.00, GBP 550.01-647.00 and GBP 647.01+ weekly income bands. Schedule 1 paragraph 4 caps the dependant count at two.
