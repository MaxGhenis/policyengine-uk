description: Three Rivers Council Tax Reduction working-age capital limit. The council's working-age scheme page states that working-age applicants must have "less than 8,000 pounds in capital" to qualify, so the boundary is strict at 8,000 pounds (capital of exactly 8,000 pounds is excluded).
