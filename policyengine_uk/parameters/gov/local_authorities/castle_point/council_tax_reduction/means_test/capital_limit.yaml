description: Castle Point Council Tax Reduction working-age capital limit. Paragraph 30.1 sets the prescribed amount at 6,000 pounds; no reduction shall be granted when the applicant has an amount greater than this level. Schedule 1 paragraph 5 repeats the same threshold.
