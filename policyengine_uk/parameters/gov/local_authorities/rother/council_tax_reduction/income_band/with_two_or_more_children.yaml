description: Rother weekly income-band Council Tax Reduction rate for households with two or more children or young persons. Schedule 1 paragraph 1 of the adopted 2026/27 scheme sets discount rates 100/60/40/20/0 per cent across the GBP 0.00-308.24, GBP 308.25-373.82, GBP 373.83-439.43, GBP 439.44-505.02 and GBP 505.03+ weekly income bands. Schedule 1 paragraph 4 caps the dependant count at two.
