description: Rother Council Tax Reduction weekly earnings disregard. Section 19.1 of the adopted 2026/27 scheme disregards 25 pounds per week from the net earnings of an applicant (or their partner) who is employed in genuine and effective work, irrespective of the applicant's household, with only one disregard per claim.
values:
  2026-04-01: 25
