description: Solihull 2026/27 Standard Earnings Disregard. Schedule 4 paragraph 1 grants a single disregard of up to 50 pounds per week for an applicant whose claimant or partner is in receipt of earnings as an employed person or is self-employed; Schedule 4 paragraph 2 confirms only one disregard applies per applicant and that where the earnings are less than 50 then the full amount shall be disregarded.
metadata:
