description: Solihull Schedule 2 paragraph 75 further disregard. Where any of the applicant, their partner or any dependent child(ren) are disabled (in receipt of Personal Independence Payment, an Armed Forces Independence Payment or Disability Living Allowance), a further 50 pounds per week is disregarded from the applicant's income (a single disregard for the family, not per qualifying member).
