description: Maximum proportion of council tax that Solihull Metropolitan Borough Council's working-age Council Tax Reduction Scheme covers from the 2026/27 scheme year. Section 48.1 of the adopted scheme defines the maximum reduction as 85 per cent of council tax divided by days in the year, matching the Schedule 1 Table 1 Band 1 rate.
metadata:
  unit: /1
  label: Solihull maximum Council Tax Reduction rate
  reference:
    - title: Solihull Metropolitan Borough Council - Council Tax Reduction Scheme 2026/27 (S13A and Schedule 1A LGFA 1992), section 48.1
      href: https://www.solihull.gov.uk/sites/default/files/2026-02/Council-Tax-Reduction-Scheme-2026-2027.pdf
values:
  2026-04-01: 0.85
