description: Capital cutoff in Solihull's 2026/27 working-age Council Tax Reduction Scheme. Class D paragraph (g) and Schedule 1 paragraph 5 both say "not have capital savings of 16,000 pounds or above" - capital of exactly 16,000 (or more) excludes the applicant, capital below 16,000 is ignored.
