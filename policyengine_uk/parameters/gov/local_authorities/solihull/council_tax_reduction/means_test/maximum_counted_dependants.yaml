description: Cap on the dependant count when selecting the Solihull 2026/27 income band column. Schedule 1 Table 1 publishes columns for Single, Single with 1 Child, Single with 2+ Children, Couples, Couple with 1 Child and Couple with 2+ Children, so a household with three or more children uses the 2+ column.
