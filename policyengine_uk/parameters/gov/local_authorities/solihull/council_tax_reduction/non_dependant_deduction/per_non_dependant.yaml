description: Solihull 2026/27 weekly non-dependant deduction. Section 48.5 reduces the Council Tax Reduction by 10 pounds per week for each non-dependant residing in the household, after the band percentage. Section 48.6 waives all non-dependant deductions where the applicant would have received a disability premium under the prescribed pensioner scheme; the implementation approximates that exemption through the shared council_tax_reduction_household_has_non_dep_exemption helper, which captures applicant or partner in receipt of Attendance Allowance, the care component of Disability Living Allowance, the daily living component of Personal Independence Payment, an Armed Forces Independence Payment or who is registered blind.
