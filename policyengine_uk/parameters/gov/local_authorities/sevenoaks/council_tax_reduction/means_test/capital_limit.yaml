description: Sevenoaks Council Tax Reduction working-age capital limit for non-passported applicants. Section 27.2 of the adopted 2026/27 scheme sets the prescribed amount at 6,000 pounds and Schedule 1 paragraph 5 excludes applicants whose capital is greater than that level. The boundary is strict above 6,000 pounds (capital at exactly 6,000 remains eligible). The capital disregards separately disregard all capital for applicants on Income Support, income-based Jobseeker's Allowance or income-related Employment and Support Allowance.
values:
  2026-04-01: 6_000
