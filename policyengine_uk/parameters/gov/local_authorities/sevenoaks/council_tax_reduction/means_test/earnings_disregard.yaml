description: Sevenoaks Council Tax Reduction working-age weekly earnings disregard. Section 19.2 of the adopted 2026/27 scheme states that 25 pounds per week is disregarded from an applicant's net earnings, applies irrespective of the applicant's household, and only one disregard is applied per claim.
values:
