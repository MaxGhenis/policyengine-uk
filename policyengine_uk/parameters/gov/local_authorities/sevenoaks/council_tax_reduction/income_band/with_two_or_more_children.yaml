description: Sevenoaks weekly income-band Council Tax Reduction rate for couples or lone parents with two or more children or young persons. Schedule 1 paragraph 1 of the adopted 2026/27 scheme sets discount rates 80/60/40/20/0 per cent across the GBP 0-308.99, GBP 309.00-384.99, GBP 385.00-449.99, GBP 450.00-577.99 and GBP 578.00+ weekly income bands. Schedule 1 paragraph 4 caps the dependant count at two.
