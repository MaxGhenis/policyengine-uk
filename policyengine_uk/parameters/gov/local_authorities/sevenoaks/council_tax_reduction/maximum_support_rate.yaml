description: Sevenoaks maximum Council Tax Reduction rate. Schedule 1 paragraph 1 of the adopted 2026/27 scheme sets the top Band 1 discount at 80 per cent of council tax liability. Working-age applicants must pay at least 20 per cent of their Council Tax charge.
