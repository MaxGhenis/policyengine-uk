description: Wirral 2026/27 Standard Earnings Disregard. Schedule 4 paragraph 1 grants a single disregard of up to 20 pounds per week for an applicant whose claimant or partner has earnings from employment; paragraph 3 confirms only one disregard applies per application, irrespective of household composition.
