description: Wirral 2026/27 maximum eligible Council Tax liability cap. Section 48.0 caps amount A at Band D liability, so for dwellings in Bands E-H the eligible liability is the Band D equivalent calculated using the English Council Tax band ratio table (9/9 for Band D).
