description: Wirral Schedule 2 paragraph 72 further disregard. Where the applicant or partner is in receipt of Personal Independence Payment, an Armed Forces Independence Payment or Disability Living Allowance, a further 50 pounds per week is disregarded from their income, on top of the paragraph 9 disregard of the DLA/PIP/AFIP payment itself.
