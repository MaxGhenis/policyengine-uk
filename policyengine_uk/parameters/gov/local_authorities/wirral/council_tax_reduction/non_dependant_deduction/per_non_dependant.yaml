description: Wirral 2026/27 weekly non-dependant deduction. Section 48A.1 reduces the maximum Council Tax Reduction by 5 pounds per week (5 * 1/7 per day) for each non-dependant residing in the dwelling, subject to the Section 48A.4 applicant-side exemptions and the Section 48A.5/48A.6 non-dependant-side exemptions, and the Section 48A.2 collapse of a non-dependant couple's deductions into a single deduction.
