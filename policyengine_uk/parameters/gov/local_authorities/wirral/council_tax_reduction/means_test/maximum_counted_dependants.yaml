description: Cap on the dependant count when selecting the Wirral 2026/27 income band column. Schedule 1 Table 1 publishes columns for single, single with one dependant, single with 2+ dependants, couple, couple with one dependant and couple with 2+ dependants, so a household with three or more children uses the 2+ column.
