description: Wealden Council Tax Reduction weekly earnings disregard. The council's working-age scheme page deducts 25 pounds from an applicant's net earnings (and, for Universal Credit claimants, 25 pounds from the DWP-assessed UC earned income) to obtain the net figure used in the band lookup.
