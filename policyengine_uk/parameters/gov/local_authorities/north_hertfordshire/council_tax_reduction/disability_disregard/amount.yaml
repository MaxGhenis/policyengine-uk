description: North Hertfordshire Council Tax Reduction weekly disability income disregard. Schedule 2 paragraph 72 of the 2026/27 scheme applies a further 50 pound disregard from income where the applicant, their partner or dependant is entitled to Personal Independence Payment or Disability Living Allowance, in addition to the paragraph 9 disregard of the PIP/DLA payment itself.
values:
