description: North Hertfordshire Council Tax Reduction weekly earnings disregard. Section 20.2 of the 2026/27 scheme disregards up to 50 pounds per week from an applicant's (or their partner's) net earnings, irrespective of the applicant's household, with only one disregard applied per claim.
