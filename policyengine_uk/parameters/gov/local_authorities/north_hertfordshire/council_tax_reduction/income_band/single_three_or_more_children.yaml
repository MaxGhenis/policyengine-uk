description: North Hertfordshire weekly income-band Council Tax Reduction rate for single applicants with three or more children. Schedule 1 paragraph 1 of the 2026/27 scheme sets discount rates 100/75/45/25/0 per cent across the GBP 0-357.00, GBP 357.01-406.00, GBP 406.01-470.00, GBP 470.01-533.00 and GBP 533.01+ weekly income bands. Schedule 1 paragraph 4 caps the dependant count at three.
