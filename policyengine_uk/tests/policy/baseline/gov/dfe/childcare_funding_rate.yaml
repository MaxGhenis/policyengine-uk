# Each entitlement valued at DfE's national average hourly funding rate for the
# year: 2024-25 technical note Table 4, 2025-26 and 2026-27 technical notes
# Table 6. Simulation year 2025 is the 2025-26 financial year. 570 hours a year
# is 15 a week for 38 weeks; 1,140 is 30.

- name: Universal hours for a 3-year-old in 2024-25 at £5.88
  period: 2024
  absolute_error_margin: 0.01
  input:
    people:
      child:
        age: 3
        universal_childcare_entitlement_eligible: true
  output:
    universal_childcare_entitlement: 3_351.60  # 570 * 5.88

